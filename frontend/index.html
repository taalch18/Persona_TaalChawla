<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taal Chawla — AI Systems Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0c10;
      --holo-glow: #6c63ff;
      --holo-cyan: #00f2fe;
      --surface: rgba(26, 29, 39, 0.65);
      --surface2: rgba(34, 38, 58, 0.45);
      --border: rgba(108, 99, 255, 0.25);
      --border-glowing: rgba(0, 242, 254, 0.6);
      --accent: #6c63ff;
      --accent-light: #a78bfa;
      --user-bubble: rgba(42, 45, 69, 0.8);
      --ai-bubble: rgba(15, 17, 26, 0.85);
      --text: #e8eaf6;
      --text-muted: #8b90a8;
      --success: #00f2fe;
      --danger: #ef4444;
      --radius: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      /* Cyberpunk background grid pattern */
      background-image: 
        linear-gradient(rgba(108, 99, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 99, 255, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Holographic Frosted Glass Container ── */
    .dashboard-wrapper {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: rgba(10, 12, 16, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: 0 0 40px rgba(108, 99, 255, 0.05);
    }

    /* ── Header ── */
    header {
      width: 100%;
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(26, 29, 39, 0.4);
    }

    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--holo-cyan));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
      position: relative;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--holo-cyan));
      z-index: -1;
      filter: blur(4px);
      opacity: 0.7;
    }

    .header-text h1 { 
      font-size: 16px; 
      font-weight: 600; 
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }
    .header-text p  { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Holographic Call Toggle ── */
    #vapi-call-btn {
      background: transparent;
      color: var(--holo-cyan);
      border: 1px solid var(--holo-cyan);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
    }
    #vapi-call-btn:hover {
      background: rgba(0, 242, 254, 0.1);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
      transform: translateY(-1px);
    }

    .live-badge {
      background: rgba(0, 242, 254, 0.1);
      color: var(--holo-cyan);
      border: 1px solid rgba(0, 242, 254, 0.3);
      font-size: 11px; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
      letter-spacing: 1px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.2); }
      70% { opacity: 1; box-shadow: 0 0 0 6px rgba(0, 242, 254, 0); }
      100% { opacity: 0.7; box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
    }

    /* ── Chat Window (Fixed Scroll Matrix) ── */
    #chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      display: flex; 
      flex-direction: column; 
      gap: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; /* Essential iOS fluid gesture physics */
    }

    .message { display: flex; gap: 10px; max-width: 88%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .msg-icon {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0; margin-top: 2px;
    }
    .message.user .msg-icon      { background: #22263a; border: 1px solid var(--border); }
    .message.assistant .msg-icon { background: linear-gradient(135deg, var(--accent), var(--holo-cyan)); color: #fff; font-weight: 700; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.6;
      font-size: 14.5px;
    }
    .message.user .bubble      { background: var(--user-bubble); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
    .message.assistant .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

    /* ── Typing Indicator ── */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: center; gap: 10px;
      padding-left: 20px;
      margin-bottom: 10px;
    }
    .typing-indicator.visible { display: flex; }
    .dots { display: flex; gap: 5px; }
    .dots span {
      width: 7px; height: 7px; background: var(--holo-cyan);
      border-radius: 50%; animation: bounce 1.3s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Holographic Action Slots ── */
    .slots-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .slot-btn {
      background: rgba(108, 99, 255, 0.05);
      border: 1px solid var(--accent);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
    }
    .slot-btn:hover { 
      background: var(--accent); 
      box-shadow: 0 0 10px var(--accent);
      color: #fff; 
    }

    /* ── Booking Form Glass Card ── */
    .booking-form {
      background: var(--surface2);
      border: 1px solid var(--border-glowing);
      border-radius: var(--radius);
      padding: 16px; margin-top: 10px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
    }
    .booking-form p { font-size: 13px; color: var(--text-muted); }
    .booking-form input {
      background: rgba(10, 12, 16, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px; padding: 9px 12px; font-size: 14px; outline: none;
      transition: all 0.2s;
    }
    .booking-form input:focus { border-color: var(--holo-cyan); box-shadow: 0 0 8px rgba(0, 242, 254, 0.2); }
    
    .confirm-btn {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff; border: none; border-radius: 8px; padding: 10px;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .confirm-btn:hover { filter: brightness(1.1); }

    .booking-confirmed {
      background: rgba(0, 242, 254, 0.05);
      border: 1px solid var(--border-glowing);
      border-radius: var(--radius);
      padding: 14px 16px; margin-top: 10px;
      font-size: 14px; color: var(--holo-cyan);
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }

    /* ── Fixed Bottom Panel (Prevents Mobile Viewport Deflection) ── */
    .bottom-interactive-panel {
      width: 100%;
      background: rgba(15, 17, 23, 0.85);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
    }

    #input-bar {
      display: flex; gap: 10px; align-items: flex-end; width: 100%;
    }

    #user-input {
      flex: 1;
      background: rgba(10, 12, 16, 0.8);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 12px 16px; font-size: 14.5px;
      resize: none; outline: none; line-height: 1.5; max-height: 100px;
      transition: border-color 0.2s;
      font-family: var(--font);
    }
    #user-input:focus  { border-color: var(--holo-cyan); box-shadow: 0 0 8px rgba(0, 242, 254, 0.1); }

    #send-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent-light);
      width: 44px; height: 44px; border-radius: 11px;
      font-size: 18px; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    #send-btn:hover:not(:disabled) { 
      background: var(--accent); 
      color: #fff;
      box-shadow: 0 0 10px var(--accent); 
    }
    #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Starter Prompts ── */
    #starters {
      display: flex; flex-wrap: wrap; gap: 8px; width: 100%; margin-bottom: 12px;
    }
    .starter {
      background: rgba(34, 38, 58, 0.3);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 20px; padding: 6px 14px; font-size: 13px;
      cursor: pointer; transition: all 0.2s ease;
    }
    .starter:hover { border-color: var(--holo-cyan); color: var(--text); background: rgba(0, 242, 254, 0.02); }

    /* ── Mobile Usability Matrix Tuning Overrides ── */
    @media (max-width: 768px) {
      body {
        background-size: 20px 20px;
      }
      .dashboard-wrapper {
        border-left: none;
        border-right: none;
      }
      #chat-window {
        padding: 16px 14px 8px;
      }
      .message { max-width: 92%; }
      .bubble { font-size: 14px; padding: 10px 14px; }
      .bottom-interactive-panel {
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); /* Accounts for iOS home gesture bar native spacing */
      }
      .starter { font-size: 12px; padding: 5px 12px; }
    }

    #chat-window::-webkit-scrollbar { width: 4px; }
    #chat-window::-webkit-scrollbar-track { background: transparent; }
    #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  </style>
</head>
<body>

<div class="dashboard-wrapper">
  <header>
    <div class="avatar">T</div>
    <div class="header-text">
      <h1>TAAL CHAWLA // NODE_SYS</h1>
      <p>Autonomous AI Agent Pipeline Active</p>
    </div>
    <div class="header-actions">
      <button id="vapi-call-btn">📞 LINK AGENT</button>
      <div class="live-badge">CORE</div>
    </div>
  </header>

  <div id="chat-window"></div>

  <div class="typing-indicator" id="typing">
    <div class="msg-icon" style="background:linear-gradient(135deg,#6c63ff,#00f2fe);color:#fff;font-weight:700;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;">T</div>
    <div class="bubble" style="background:var(--ai-bubble);border:1px solid var(--border);">
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <div class="bottom-interactive-panel">
    <div id="starters">
      <button class="starter" onclick="sendStarter(this)">Why should you hire Taal?</button>
      <button class="starter" onclick="sendStarter(this)">Tell me about NexusOps</button>
      <button class="starter" onclick="sendStarter(this)">What are her key skills?</button>
      <button class="starter" onclick="sendStarter(this)">Schedule a call</button>
    </div>

    <div id="input-bar">
      <textarea id="user-input" rows="1" placeholder="Query agent matrix..."></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">&#8593;</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vapi-ai/web@1.0.0/dist/vapi.browser.js"></script>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const API_BASE = window.location.origin;
    const chatWindow = document.getElementById("chat-window");
    const input = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const typing = document.getElementById("typing");
    const starters = document.getElementById("starters");

    let conversationHistory = [];
    let pendingSlotStart = null;

    // ── VAPI SECURITY & CHANNEL ORCHESTRATION ──
    // PASTE YOUR KEYS HERE IF DEPLOYING WEB OVERLAY:
    const VAPI_PUBLIC_KEY = 'your_extracted_widget_public_key_here'; 
    const VAPI_ASSISTANT_ID = 'your_extracted_assistant_id_here';

    const vapi = new Vapi(VAPI_PUBLIC_KEY);
    const voiceCallBtn = document.getElementById('vapi-call-btn');
    let isVoiceActive = false;

    if (voiceCallBtn && VAPI_PUBLIC_KEY !== 'your_extracted_widget_public_key_here') {
      voiceCallBtn.addEventListener('click', () => {
        if (!isVoiceActive) {
          console.log("[INFRA] Connecting live WebRTC vector streams...");
          vapi.start(VAPI_ASSISTANT_ID);
          voiceCallBtn.innerHTML = "🛑 DISCONNECT";
          voiceCallBtn.style.border = "1px solid var(--danger)";
          voiceCallBtn.style.color = "var(--danger)";
          isVoiceActive = true;
        } else {
          vapi.stop();
          resetVoiceButton();
        }
      });
    }

    function resetVoiceButton() {
      if (voiceCallBtn) {
        voiceCallBtn.innerHTML = "📞 LINK AGENT";
        voiceCallBtn.style.border = "1px solid var(--holo-cyan)";
        voiceCallBtn.style.color = "var(--holo-cyan)";
        isVoiceActive = false;
      }
    }

    vapi.on('call-end', () => { resetVoiceButton(); });

    // ── TEXT CONVERSATION AND TEXT OVERFLOW FLOWS ──
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 100) + "px";
    });

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    window.sendStarter = function(btn) {
      input.value = btn.textContent;
      starters.style.display = "none";
      sendMessage();
    }

    function appendMessage(role, content, extraHtml = "") {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      const icon = role === "user" ? "👤" : "T";
      div.innerHTML = `
        <div class="msg-icon">${icon}</div>
        <div>
          <div class="bubble">${content}</div>
          ${extraHtml}
        </div>`;
      chatWindow.appendChild(div);
      chatWindow.scrollTop = chatWindow.scrollHeight;
      return div;
    }

    function showTyping() {
      chatWindow.appendChild(typing);
      typing.classList.add("visible");
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function hideTyping() {
      typing.classList.remove("visible");
    }

    window.sendMessage = async function() {
      const text = input.value.trim();
      if (!text) return;

      starters.style.display = "none";
      input.value = "";
      input.style.height = "auto";
      sendBtn.disabled = true;

      appendMessage("user", escapeHtml(text));
      conversationHistory.push({ role: "user", content: text });
      showTyping();

      const schedulingKeywords = ["schedule", "book", "call", "meeting", "available", "availability", "slot", "time"];
      const wantsBooking = schedulingKeywords.some(kw => text.toLowerCase().includes(kw));

      try {
        if (wantsBooking) {
          await handleBookingFlow(text);
        } else {
          await handleChat(text);
        }
      } catch (err) {
        hideTyping();
        appendMessage("assistant", "CRITICAL_ERROR: Connection to inference node dropped. Reload session context.");
      }

      sendBtn.disabled = false;
    }

    async function handleChat(text) {
      const res = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_history: conversationHistory.slice(-6) })
      });
      const data = await res.json();
      hideTyping();
      const reply = data.response || "Inference node timeout. Reissue statement block.";
      appendMessage("assistant", escapeHtml(reply));
      conversationHistory.push({ role: "assistant", content: reply });
    }

    async function handleBookingFlow(text) {
      const chatRes = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_history: conversationHistory.slice(-6) })
      });

      const slotsRes = await fetch(`${API_BASE}/check-availability`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ timezone: "Asia/Kolkata" })
      });
      const slotsData = await slotsRes.json();
      hideTyping();

      if (!slotsData.slots || slotsData.slots.length === 0) {
        appendMessage("assistant", "I couldn't locate available calendar slots right now. Please message Taal directly via email.");
        return;
      }

      const slotsHtml = `
        <div class="slots-container">
          ${slotsData.slots.map(s =>
            `<button class="slot-btn" onclick="selectSlot('${s.start}', '${escapeHtml(s.display)}', this)">${s.display}</button>`
          ).join("")}
        </div>`;

      appendMessage("assistant", "Syncing schedule matrices. Select an open availability node below:", slotsHtml);
    }

    window.selectSlot = function(isoStart, displayTime, btn) {
      pendingSlotStart = isoStart;
      document.querySelectorAll(".slot-btn").forEach(b => b.disabled = true);
      btn.style.background = "var(--accent)";
      btn.style.borderColor = "var(--holo-cyan)";
      btn.style.color = "#fff";

      const formDiv = document.createElement("div");
      formDiv.className = "booking-form";
      formDiv.innerHTML = `
        <p>Allocating seat block: <strong>${displayTime}</strong>. Input validation vectors:</p>
        <input id="booking-name" type="text" placeholder="Identity String (Name)" />
        <input id="booking-email" type="email" placeholder="Routing Node (Email)" />
        <button class="confirm-btn" id="confirm-btn" onclick="confirmBooking()">Commit Calendar Block</button>`;
      chatWindow.appendChild(formDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    window.confirmBooking = async function() {
      const name = document.getElementById("booking-name").value.trim();
      const email = document.getElementById("booking-email").value.trim();
      if (!name || !email) {
        alert("Parameters incomplete. Identity and routing vectors are required.");
        return;
      }

      document.getElementById("confirm-btn").disabled = true;
      document.getElementById("confirm-btn").textContent = "Writing transaction matrix...";

      try {
        const res = await fetch(`${API_BASE}/book-slot`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            slot_start: pendingSlotStart,
            attendee_name: name,
            attendee_email: email,
            timezone: "Asia/Kolkata"
          })
        });
        const data = await res.json();

        document.querySelector(".booking-form").remove();

        if (data.confirmed) {
          const confirmDiv = document.createElement("div");
          confirmDiv.className = "booking-confirmed";
          confirmDiv.innerHTML = `✓ <strong>Transaction committed:</strong> ${data.confirmation_message}`;
          chatWindow.appendChild(confirmDiv);
          conversationHistory.push({ role: "assistant", content: data.confirmation_message });
        } else {
          appendMessage("assistant", "Transaction failed to commit to main cluster branch. Reissue attempt.");
        }
      } catch (err) {
        appendMessage("assistant", "Upstream calendar engine dropped the handshake packet. Contact target directly.");
      }

      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/\n/g, "<br>");
    }

    // Initial greeting sequence
    appendMessage("assistant",
      "SYSTEM RUNLEVEL 5 // Welcome. I am Taal Chawla's proxy representative node. I have direct context vectors regarding her engineering foundations in machine learning systems (NexusOps, Brain Tumor Calibration) and native calendar availability. State your operational query."
    );
  });
</script>
</body>
</html>
